name: Pull Request

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Verify Prisma client is committed and up to date
        run: git diff --exit-code -- src/generated/prisma

      - name: Lint
        run: pnpm lint

      - name: Verify core does not depend on features
        run: pnpm verify:boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build application
        run: pnpm build

      - name: Start the Compose stack from a clean state
        run: |
          cp .env.example .env
          docker compose --project-name compose-check up --detach --build

      - name: Verify the Compose stack serves readiness
        id: readiness
        run: |
          curl --fail --silent --show-error \
            --max-time 10 \
            --retry 30 --retry-delay 2 --retry-max-time 90 \
            --retry-all-errors --retry-connrefused \
            http://localhost:3000/api/v1/health/ready

      - name: Report why the Compose stack never became ready
        if: failure() && steps.readiness.outcome == 'failure'
        run: docker compose --project-name compose-check logs

      - name: Stop the Compose stack
        if: always()
        run: |
          docker compose --project-name compose-check down --volumes
